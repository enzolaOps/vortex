<!--
  Single-colour variant, used by the PWA manifest as the `monochrome` icon.
  No background: the platform paints one behind it. If you change brand/mark.svg
  remember to mirror the artwork here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <g fill="currentColor">
    <path d="M256 256 C 268 186, 328 140, 402 140 C 402 214, 344 262, 256 256 Z"/>
    <path d="M256 256 C 268 186, 328 140, 402 140 C 402 214, 344 262, 256 256 Z" transform="rotate(120 256 256)"/>
    <path d="M256 256 C 268 186, 328 140, 402 140 C 402 214, 344 262, 256 256 Z" transform="rotate(240 256 256)"/>
  </g>
</svg>
