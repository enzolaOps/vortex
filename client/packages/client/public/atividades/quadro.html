<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!--
  Host da atividade "Quadro branco".

  Roda num iframe com sandbox="allow-scripts" (origem opaca): não alcança o
  token, o armazenamento nem o DOM do Vortex. A CSP abaixo fecha o resto —
  nenhuma rede, nenhum recurso externo, e só ESTE script, pelo hash. O teste
  `quadro.test.ts` recalcula o hash e reprova se o script mudar sem ele.

  Contrato com o app: `src/voz/atividades/protocolo.ts`.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-O1HtZtYqv+PDXG55PhY6wo8nRRDUFqIZYSC456wXnbY='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Quadro branco</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f6f8; font: 12px/1.2 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .barra { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; padding: 5px; border-radius: 8px; background: rgba(27, 32, 40, 0.9); }
  .cor { width: 20px; height: 20px; border: 2px solid transparent; border-radius: 999px; cursor: pointer; padding: 0; }
  .cor[aria-pressed="true"] { border-color: #e6eaf0; }
  .limpar { height: 20px; padding: 0 8px; border: 0; border-radius: 5px; background: transparent; color: #a5aebb; font: inherit; font-weight: 600; cursor: pointer; }
  .limpar:hover { color: #e6eaf0; }
  button:focus-visible { outline: 2px solid #35c2cc; outline-offset: 1px; }
</style>
</head>
<body>
<canvas id="q" aria-label="Quadro branco compartilhado"></canvas>
<div class="barra" role="toolbar" aria-label="Ferramentas do quadro">
  <button class="cor" type="button" data-cor="#1b2028" aria-label="Preto" aria-pressed="true" style="background:#1b2028"></button>
  <button class="cor" type="button" data-cor="#e8596b" aria-label="Vermelho" aria-pressed="false" style="background:#e8596b"></button>
  <button class="cor" type="button" data-cor="#0e7c86" aria-label="Azul-petróleo" aria-pressed="false" style="background:#0e7c86"></button>
  <button class="cor" type="button" data-cor="#d49a1c" aria-label="Amarelo" aria-pressed="false" style="background:#d49a1c"></button>
  <button class="limpar" type="button" id="limpar">Limpar</button>
</div>
<script>
(function () {
  "use strict";
  var V = 1;
  var TETO = 3800;
  var canvas = document.getElementById("q");
  var ctx = canvas.getContext("2d");
  var tracos = [];
  var vistos = new Set();
  var cor = "#1b2028";
  var atual = null;

  function enviar(m) {
    m.vortex = V;
    parent.postMessage(m, "*");
  }

  function novoId() {
    var b = new Uint8Array(8);
    crypto.getRandomValues(b);
    return Array.prototype.map.call(b, function (x) { return (x + 256).toString(16).slice(1); }).join("");
  }

  function escala() { return window.devicePixelRatio || 1; }

  function desenhar(t) {
    var p = t.p;
    if (p.length < 2) return;
    var w = canvas.width, h = canvas.height;
    ctx.strokeStyle = t.c;
    ctx.lineWidth = 3 * escala();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(p[0] * w, p[1] * h);
    if (p.length === 2) ctx.lineTo(p[0] * w + 0.1, p[1] * h);
    for (var i = 2; i + 1 < p.length; i += 2) ctx.lineTo(p[i] * w, p[i + 1] * h);
    ctx.stroke();
  }

  function redesenhar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tracos.forEach(desenhar);
  }

  function valido(t) {
    if (!t || typeof t.id !== "string" || t.id.length > 32) return false;
    if (t.t === "limpar") return true;
    if (t.t !== "traco" || typeof t.c !== "string" || !/^#[0-9a-f]{6}$/i.test(t.c)) return false;
    if (!Array.isArray(t.p) || t.p.length % 2 !== 0) return false;
    return t.p.every(function (n) { return typeof n === "number" && n >= 0 && n <= 1; });
  }

  function aplicar(texto) {
    var t;
    try { t = JSON.parse(texto); } catch (e) { return; }
    if (!valido(t) || vistos.has(t.id)) return;
    vistos.add(t.id);
    if (t.t === "limpar") { tracos = []; redesenhar(); return; }
    tracos.push(t);
    desenhar(t);
  }

  function ponto(e) {
    var r = canvas.getBoundingClientRect();
    var x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    var y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    return [Math.round(x * 1000) / 1000, Math.round(y * 1000) / 1000];
  }

  function fechar() {
    var t = atual;
    atual = null;
    if (!t || t.p.length < 2) return;
    vistos.add(t.id);
    tracos.push(t);
    enviar({ tipo: "op", op: JSON.stringify(t) });
  }

  canvas.addEventListener("pointerdown", function (e) {
    canvas.setPointerCapture(e.pointerId);
    atual = { id: novoId(), t: "traco", c: cor, p: ponto(e) };
    desenhar(atual);
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!atual) return;
    var q = ponto(e);
    var p = atual.p;
    var w = canvas.width, h = canvas.height;
    ctx.strokeStyle = atual.c;
    ctx.lineWidth = 3 * escala();
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(p[p.length - 2] * w, p[p.length - 1] * h);
    ctx.lineTo(q[0] * w, q[1] * h);
    ctx.stroke();
    p.push(q[0], q[1]);
    // Traço longo vira vários: cada operação cabe no teto do servidor.
    if (JSON.stringify(atual).length > TETO) {
      var c = atual.c;
      fechar();
      atual = { id: novoId(), t: "traco", c: c, p: q };
    }
  });

  canvas.addEventListener("pointerup", fechar);
  canvas.addEventListener("pointercancel", fechar);

  Array.prototype.forEach.call(document.querySelectorAll(".cor"), function (b) {
    b.addEventListener("click", function () {
      cor = b.getAttribute("data-cor");
      Array.prototype.forEach.call(document.querySelectorAll(".cor"), function (o) {
        o.setAttribute("aria-pressed", String(o === b));
      });
    });
  });

  document.getElementById("limpar").addEventListener("click", function () {
    var t = { id: novoId(), t: "limpar" };
    vistos.add(t.id);
    tracos = [];
    redesenhar();
    // `snapshot`: limpar SUBSTITUI o registro — quem chega depois não repassa
    // quinhentos traços apagados.
    enviar({ tipo: "op", op: JSON.stringify(t), snapshot: true });
  });

  window.addEventListener("message", function (e) {
    if (e.source !== parent) return;
    var m = e.data;
    if (!m || m.vortex !== V) return;
    if (m.tipo === "carregar" && Array.isArray(m.registro)) {
      tracos = [];
      vistos = new Set();
      m.registro.forEach(function (o) { if (typeof o === "string") aplicar(o); });
      redesenhar();
    } else if (m.tipo === "op" && typeof m.op === "string") {
      aplicar(m.op);
    }
  });

  function medir() {
    var r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * escala()));
    canvas.height = Math.max(1, Math.round(r.height * escala()));
    redesenhar();
  }
  new ResizeObserver(medir).observe(canvas);
  medir();

  enviar({ tipo: "pronto" });
})();
</script>
</body>
</html>
