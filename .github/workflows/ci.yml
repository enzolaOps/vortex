# Um workflow, uma função por etapa, um check obrigatório (`CI`).
#
# - PR: tudo o que a área tocada exige — typecheck, lint, guards, testes,
#   build, E2E, clippy.
# - merge_group: só o que o código COMBINADO pode quebrar — typecheck, guards,
#   testes e build. Lint, clippy, E2E e desktop não mudam de veredito por
#   combinação. A fila não é redundante: #376, #380 e #384 passaram cada um no
#   próprio PR e quebraram `variaveisDefinidas` juntos.
# - push na main: só aquece os caches. Cache salvo em PR ou na fila fica preso
#   àquela ref; só o da main é lido pelos PRs seguintes.
name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# Só um PR cancela a execução anterior. Na main, cada merge cancelaria a
# análise ou o aquecimento em andamento, e com merges seguidos nada terminaria.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SERVER_PACOTES: -p revolt-delta -p revolt-bonfire -p revolt-models -p revolt-database

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.d.outputs.client }}
      server: ${{ steps.d.outputs.server }}
      desktop: ${{ steps.d.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sh scripts/ci/fronteiras.sh
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          files=$(git diff --name-only "$BASE"...HEAD | grep -vE '\.md$' || true)
          printf '%s\n' "$files"
          area() {
            if printf '%s\n' "$files" | grep -qE "$1|^\.github/workflows/ci\.yml$"; then echo true; else echo false; fi
          }
          {
            echo "client=$(area '^(client/|brand/|\.github/actions/preparar-client/)')"
            echo "server=$(area '^server/')"
            echo "desktop=$(area '^desktop/')"
          } | tee -a "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ client
  # nucleo, app (estático) e app (testes) em paralelo: o caminho crítico vira
  # o dos testes do app, não a soma dos três.

  nucleo:
    name: nucleo
    needs: detect
    if: needs.detect.outputs.client == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/preparar-client
      - run: pnpm --filter nucleo typecheck
      - if: github.event_name == 'pull_request'
        run: pnpm --filter nucleo lint
      - run: pnpm --filter nucleo test

  app-estatico:
    name: app (typecheck, guards, build)
    needs: detect
    if: needs.detect.outputs.client == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/preparar-client
      - run: pnpm --filter app typecheck
      - if: github.event_name == 'pull_request'
        run: pnpm --filter app lint
      - run: pnpm --filter app guards
      - run: pnpm --filter app build

  app-testes:
    name: app (testes)
    needs: detect
    if: needs.detect.outputs.client == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/preparar-client
        with:
          playwright: "true"
      - run: pnpm --filter app test

  e2e:
    name: E2E fumaça
    needs: detect
    if: needs.detect.outputs.client == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/preparar-client
        with:
          playwright: "true"
      - run: pnpm --filter app e2e:fumaca
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: client/packages/app/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------ server

  server-testes:
    name: server (testes)
    needs: detect
    if: needs.detect.outputs.server == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      rabbit:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: rabbituser
          RABBITMQ_DEFAULT_PASS: rabbitpass
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
      maildev:
        image: maildev/maildev:2.2.1
        env:
          MAILDEV_SMTP_PORT: 25
          MAILDEV_WEB_PORT: 8080
          MAILDEV_INCOMING_USER: smtp
          MAILDEV_INCOMING_PASS: smtp
        ports:
          - 14025:25
          - 14080:8080
    env:
      TEST_DB: REFERENCE
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A toolchain vem de server/rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Restaurar o cache do cargo
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-testes-${{ hashFiles('server/Cargo.lock', 'server/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-testes-
      - name: Instalar o cargo-nextest
        run: |
          mkdir -p ~/.cargo/bin
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.cargo/bin
          cargo nextest --version
      # Dois testes de privacidade seguem excluídos, como no workflow anterior.
      - name: Testes
        run: >-
          cargo nextest run --locked $SERVER_PACOTES
          --no-fail-fast
          -E 'not (test(=routes::users::open_dm::test::privacidade_por_servidor_barra_dm_nova) | test(=routes::users::send_friend_request::test::privacidade_por_servidor_barra_pedido_de_amizade))'

  server-clippy:
    name: server (clippy)
    needs: detect
    if: needs.detect.outputs.server == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: (rustup show active-toolchain || rustup toolchain install) && rustup component add clippy
      - name: Restaurar o cache do cargo
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('server/Cargo.lock', 'server/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - run: cargo clippy --locked $SERVER_PACOTES -- -D warnings

  # ----------------------------------------------------------------- desktop

  desktop:
    name: desktop
    needs: detect
    if: needs.detect.outputs.desktop == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: corepack enable && pnpm --version
      - name: Store do pnpm
        id: pnpm
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: ${{ runner.os }}-desktop-${{ hashFiles('desktop/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-desktop-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm lint

  # ---------------------------------------------------- aquecimento (main)

  aquecer-client:
    name: Aquecer cache (client)
    needs: detect
    if: needs.detect.outputs.client == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/preparar-client
        with:
          playwright: "true"

  aquecer-server:
    name: Aquecer cache (server ${{ matrix.tarefa }})
    needs: detect
    if: needs.detect.outputs.server == 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        tarefa: [testes, clippy]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: (rustup show active-toolchain || rustup toolchain install) && rustup component add clippy
      # Chave nova a cada Cargo.lock/toolchain; a mesma chave nunca é regravada.
      - name: Cache do cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-${{ matrix.tarefa }}-${{ hashFiles('server/Cargo.lock', 'server/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.tarefa }}-
      - if: matrix.tarefa == 'testes'
        name: Instalar o cargo-nextest
        run: |
          mkdir -p ~/.cargo/bin
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.cargo/bin
      - if: matrix.tarefa == 'testes'
        run: cargo nextest run --locked $SERVER_PACOTES --no-run
      - if: matrix.tarefa == 'clippy'
        run: cargo clippy --locked $SERVER_PACOTES -- -D warnings

  # -------------------------------------------------------------------- gate
  # Único check obrigatório. Job pulado (área intocada ou fora da etapa) passa;
  # qualquer outro resultado, ou erro do próprio jq, reprova.

  ci:
    name: CI
    needs: [detect, nucleo, app-estatico, app-testes, e2e, server-testes, server-clippy, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "$NEEDS"
          jq -e '.detect.result == "success" and (to_entries | all(.value.result == "success" or .value.result == "skipped"))' <<< "$NEEDS" >/dev/null
