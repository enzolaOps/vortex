# Build the Vortex web client and publish it to GHCR.
#
# This repository is private, so the free native arm64 runners are not
# available. Instead the image is cross-built on a standard amd64 runner: the
# Dockerfile pins its builder stage to $BUILDPLATFORM, so pnpm install and vite
# build run natively and only the tiny runtime stage — a single pure-JS
# dependency — is emulated. A full QEMU build would take roughly an hour and eat
# the free Actions minutes; this takes a few.
#
# If this repo ever becomes public, or the org moves to a plan with arm64
# runners, drop the QEMU step and set `runs-on: ubuntu-24.04-arm` with
# `platforms: linux/arm64` for a fully native build.
#
# The image is private too, like the repository. The Pi already authenticates to
# GHCR — see the docker login step in the pi-infra README.
#
# The digest to pin is printed in the job summary.
name: Vortex image

on:
  push:
    branches:
      - main
    # Only the web client goes into this image. The Electron shell in desktop/
    # is built by hand and shares nothing with it.
    paths:
      - "web/**"
      - "!web/**/*.md"
      - "brand/**"
      - ".github/workflows/vortex-image.yml"
  workflow_dispatch:

concurrency:
  group: vortex-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The upstream brand-assets submodule is removed in this fork, so a
      # recursive checkout no longer reaches a host we cannot authenticate to.
      # The remaining submodules are public.
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # An empty submodule directory does not fail the build where it happens:
      # pnpm --filter exits 0 when no project matches, and the failure only
      # surfaces much later as MODULE_NOT_FOUND while loading lingui.config.ts.
      - name: Verify the submodules were checked out
        run: |
          for d in web/packages/stoat.js web/packages/solid-livekit-components web/packages/js-lingui-solid; do
            if [ -z "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "Submodule $d is empty — the gitlink or .gitmodules entry is missing." >&2
              exit 1
            fi
          done

      - name: Guard against upstream branding creeping back in
        run: node brand/rename-catalogs.mjs --check

      - name: Lowercase the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Only the arm64 runtime stage needs emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./web
          # amd64 costs almost nothing here (the builder stage is shared) and
          # lets the client be run locally for debugging.
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Vortex web client
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the digest to pin
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "VORTEX_WEB_IMAGE=${{ steps.image.outputs.name }}:${{ github.sha }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Paste that line into pi-infra \`compose/versions.env\`, then \`make vortex-update\`."
          } >> "$GITHUB_STEP_SUMMARY"
