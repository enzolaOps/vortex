# Constrói o cliente Vortex e publica no GHCR quando uma GitHub Release
# `v*` cobre mudanças em `client/` ou `brand/` desde a tag anterior.
# `workflow_dispatch` força o build. `vendor/` nunca entra.
name: Vortex client image

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: vortex-client-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.d.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --tags --force
      - id: d
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if scripts/ci/changed.sh client; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/release-notes.sh

  build:
    name: Build and push
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      # Diretório de submodule vazio não falha onde acontece: o `pnpm --filter`
      # sai com 0 quando nenhum projeto casa, e o erro só aparece muito depois
      # como um import que não resolve. O cliente tem um submodule.
      - name: Verify the SDK submodule was checked out
        run: |
          if [ -z "$(ls -A client/packages/stoat.js 2>/dev/null)" ]; then
            echo "client/packages/stoat.js está vazio — falta o gitlink ou a entrada em .gitmodules." >&2
            exit 1
          fi

      - name: Image name and tags
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vortex-client"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$name:latest"
            echo "$name:$GITHUB_SHA"
            if [ "${{ github.event_name }}" = "release" ]; then
              echo "$name:$GITHUB_REF_NAME"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Só o estágio de runtime arm64 precisa de emulação.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # Contexto na RAIZ; o `.dockerignore` derruba `vendor/` e deixa só `client/` e `brand/`.
          context: .
          file: ./client/Dockerfile
          # amd64 custa quase nada aqui (o estágio de build é compartilhado) e
          # deixa o cliente rodar localmente para depuração.
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Vortex client
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the digest to pin
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "VORTEX_CLIENT_IMAGE=${{ steps.image.outputs.name }}:${{ github.sha }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "O build atualiza o PR de imagens do pi-infra."
            echo
            echo "A imagem serve na porta 5000 e resolve a API"
            echo "contra a própria origem — as variáveis \`VITE_*\` do compose não são"
            echo "necessárias para ela."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: enzolaOps
          repositories: pi-infra

      - name: Update the deployment PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}@${{ steps.push.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          jq -n --arg image "$IMAGE" --arg revision "$REVISION" '{event_type:"vortex-client-published",client_payload:{revision:$revision,updates:{VORTEX_CLIENT_IMAGE:$image}}}' |
            curl --fail-with-body \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data @- \
              https://api.github.com/repos/enzolaOps/pi-infra/dispatches
