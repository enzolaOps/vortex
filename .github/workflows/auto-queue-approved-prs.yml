name: Auto-queue approved pull requests

on:
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["Vortex client image"]
    types: [completed]

permissions:
  contents: read

jobs:
  enqueue:
    name: Add approved PR to merge queue
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: enzolaOps
          repositories: vortex

      - name: Resolve PR and verify approval and required client check
        id: verify
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_COMMIT_ID: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            PR_URL="$EVENT_PR_URL"
            if [ "$REVIEW_STATE" != "approved" ] || [ "$REVIEW_COMMIT_ID" != "$HEAD_SHA" ]; then
              echo "This review does not approve the current head commit; skipping."
              exit 0
            fi
          else
            PR_URL="$(gh api "repos/enzolaOps/vortex/commits/$HEAD_SHA/pulls" \
              --jq 'map(select(.state == "open" and .base.ref == "main" and .head.sha == env.HEAD_SHA and .draft == false)) | .[0].html_url // empty')"
            if [ -z "$PR_URL" ]; then
              echo "No open, non-draft PR targeting main matches this workflow run; skipping."
              exit 0
            fi
          fi

          PR_JSON="$(gh pr view "$PR_URL" --json number,id,headRefOid,isDraft,baseRefName)"
          PR_NUMBER="$(jq -r '.number' <<< "$PR_JSON")"
          PR_ID="$(jq -r '.id' <<< "$PR_JSON")"
          CURRENT_SHA="$(jq -r '.headRefOid' <<< "$PR_JSON")"

          if [ "$CURRENT_SHA" != "$HEAD_SHA" ] ||
             [ "$(jq -r '.baseRefName' <<< "$PR_JSON")" != "main" ] ||
             [ "$(jq -r '.isDraft' <<< "$PR_JSON")" = "true" ]; then
            echo "PR state or head SHA changed; skipping."
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            REVIEWS="$(gh api "repos/enzolaOps/vortex/pulls/$PR_NUMBER/reviews")"
            if ! jq -e --arg sha "$HEAD_SHA" \
              'map(select(.commit_id == $sha and .state == "APPROVED")) | length > 0' \
              <<< "$REVIEWS" >/dev/null; then
              echo "No approval for the current head commit; skipping."
              exit 0
            fi
          fi

          CHECKS="$(gh api "repos/enzolaOps/vortex/commits/$HEAD_SHA/check-runs")"
          CLIENT_CHECK="$(jq -c '[.check_runs[] | select(.name == "Vortex client")] | last // empty' <<< "$CHECKS")"
          if [ -z "$CLIENT_CHECK" ] || [ "$(jq -r '.status' <<< "$CLIENT_CHECK")" != "completed" ]; then
            echo "Vortex client is not complete yet; the workflow_run trigger will retry after it finishes."
            exit 0
          fi
          if [ "$(jq -r '.conclusion' <<< "$CLIENT_CHECK")" != "success" ]; then
            echo "Vortex client did not succeed; skipping enqueue."
            exit 0
          fi

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_id=$PR_ID" >> "$GITHUB_OUTPUT"

      - name: Add PR to merge queue
        if: steps.verify.outputs.pr_id != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_ID: ${{ steps.verify.outputs.pr_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if OUTPUT="$(gh api graphql \
              -f query='mutation($pullRequestId: ID!) {
                enqueuePullRequest(input: {pullRequestId: $pullRequestId}) {
                  mergeQueueEntry { id position }
                }
              }' \
              -F pullRequestId="$PR_ID" 2>&1)"; then
              echo "$OUTPUT"
              exit 0
            fi

            echo "$OUTPUT"
            if grep -qE 'Required status check .* is expected' <<< "$OUTPUT"; then
              if [ "$attempt" -lt 20 ]; then
                echo "A required check is still pending; retrying in 30 seconds ($attempt/20)."
                sleep 30
                continue
              fi
            fi
            exit 1
          done
          exit 1
