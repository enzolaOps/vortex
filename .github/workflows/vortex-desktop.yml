# Empacota o app desktop (`vendor/stoat-desktop/`) e o anexa à release.
#
# ⚠ **Roda em TODA release publicada, e é isso que faz o app se atualizar.**
# `src/native/atualizacao.ts` usa `update.electronjs.org`, que lê a última
# release deste repositório (público) e procura nela o `RELEASES` e o `.nupkg`
# do Squirrel. Sem os anexos, todo app instalado ficaria parado na versão com
# que foi instalado — com o Chromium embutido envelhecendo junto.
#
# ⚠ **A versão da casca vem da TAG.** O Squirrel compara a versão do app
# instalado com a da release; com o `package.json` fixo em 0.1.0, nenhuma
# atualização seria reconhecida como mais nova.
#
# Nomes ESTÁVEIS para o instalador (`Vortex-Setup.exe`, `Vortex.flatpak`): o
# botão "Baixar para desktop" do cliente aponta para
# `releases/latest/download/<nome>`.
#
# Segredos opcionais (Settings → Secrets → Actions):
#   WINDOWS_CERTIFICATE_PFX       .pfx em base64 — assina o instalador
#   WINDOWS_CERTIFICATE_PASSWORD  senha do .pfx
# Sem eles o build sai sem assinatura, e o SmartScreen avisa uma vez.
#
# ⚠ **`VORTEX_APP_URL` é obrigatório e não tem padrão.** `vite.main.config.ts`
# lança se ele faltar: um padrão errado construiria uma casca apontada para o
# servidor de outra gente. Settings → Variables → Actions.
name: Vortex desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release para anexar (ex.: v1.2.3). Vazio = só artefato."
        required: false

concurrency:
  group: vortex-desktop-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  VORTEX_APP_URL: ${{ vars.VORTEX_APP_URL }}
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  empacotar:
    name: Empacotar (${{ matrix.rotulo }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      # Um alvo quebrado não deve impedir o outro de subir: quem usa Windows
      # não fica sem instalador porque o Flatpak falhou.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rotulo: Windows
            plataforma: win32
          - os: ubuntu-latest
            rotulo: Linux
            plataforma: linux

    defaults:
      run:
        working-directory: vendor/stoat-desktop
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # ⚠ Sem `pnpm/action-setup`: a política do repositório só libera ações
      # da GitHub e de `docker/*`, e uma ação de terceiro derruba o run antes
      # do primeiro passo (`startup_failure`) — a release sairia sem
      # instalador nem atualização. O corepack do Node usa o `packageManager`
      # da casca (versão e hash). Sem `cache: pnpm` no setup-node, porque ele
      # procura o pnpm antes de o corepack ativá-lo.
      - name: Ativar o pnpm da casca
        run: corepack enable && pnpm --version

      # O Flatpak precisa do construtor e do runtime; o Windows não precisa de
      # nada além do Node. Passo condicional em vez de dois jobs quase iguais.
      # Sem `-dev` do X11: o `uiohook-napi` usa o prebuild (ver `rebuildConfig`
      # em `forge.config.ts`) e não é recompilado.
      - name: Preparar Flatpak
        if: matrix.plataforma == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          # ⚠ Em `--user`, não com `sudo`: o `flatpak-bundler` do maker confere
          # cada ref e, achando-a só no sistema, roda `flatpak update` sem
          # `--user` — o que exige root. A BaseApp do Electron é a `base` que o
          # maker pede.
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Conferir que a URL da instância foi configurada
        run: |
          if [ -z "$VORTEX_APP_URL" ]; then
            echo "::error::A variável VORTEX_APP_URL não está configurada." \
              "Sem ela a casca seria construída apontada para lugar nenhum."
            exit 1
          fi
          echo "Casca apontada para $VORTEX_APP_URL"

      - name: Versionar pela tag
        if: env.TAG != ''
        run: |
          versao="${TAG#v}"
          case "$versao" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$TAG' não é semver (vX.Y.Z)."; exit 1 ;;
          esac
          npm pkg set version="$versao"
          echo "Casca na versão $versao"

      - name: Preparar certificado (opcional)
        if: matrix.plataforma == 'win32'
        env:
          PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          SENHA: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$PFX" ]; then
            echo "Sem certificado: o instalador sai sem assinatura."
            exit 0
          fi
          arquivo="$RUNNER_TEMP/vortex.pfx"
          echo "$PFX" | base64 --decode > "$arquivo"
          echo "WINDOWS_CERTIFICATE_FILE=$arquivo" >> "$GITHUB_ENV"
          echo "WINDOWS_CERTIFICATE_PASSWORD=$SENHA" >> "$GITHUB_ENV"

      - name: Empacotar
        env:
          # Lido por `forge.config.ts` para pular os makers que só existem em
          # teste local (o .deb).
          PLATFORM: ${{ matrix.plataforma }}
          # O maker do Flatpak só diz "flatpak failed with status code 1"; o
          # comando e a saída dele só aparecem com o log de depuração.
          DEBUG: ${{ matrix.plataforma == 'linux' && 'electron-installer-flatpak*,flatpak-bundler' || '' }}
        run: pnpm make

      - name: Reunir os artefatos
        run: |
          mkdir -p entrega
          # `make` espalha por `out/make/<maker>/<arch>/`. O que interessa é o
          # instalador, o manifesto de atualização e o pacote do Squirrel.
          find out/make -type f \
            \( -name "*.exe" -o -name "*.nupkg" -o -name "RELEASES" \
               -o -name "*.flatpak" \) \
            -exec cp {} entrega/ \;
          # Nome estável para o link de download do cliente.
          for f in entrega/*.flatpak; do
            [ -e "$f" ] && mv "$f" entrega/Vortex.flatpak
          done
          ls -la entrega/
          if [ -z "$(ls -A entrega)" ]; then
            echo "::error::Nenhum artefato foi produzido — o maker desta" \
              "plataforma não rodou."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vortex-desktop-${{ matrix.plataforma }}
          path: vendor/stoat-desktop/entrega/
          if-no-files-found: error

      - name: Anexar à release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" entrega/* --clobber --repo "$GITHUB_REPOSITORY"
