# Constrói a API e o serviço de eventos do Vortex, para arm64, e publica no GHCR.
#
# ⚠ **O `CLAUDE.md` do cliente registrava isto como bloqueado, e a premissa
# estava errada.** Ela dizia: "o truque do `$BUILDPLATFORM` que salva o cliente
# web não transfere para Rust — binário Rust é específico de arquitetura, não
# existe estágio neutro para rodar nativo".
#
# Verdade em geral; falso para este repositório. O `Dockerfile` do upstream já
# faz CROSS-COMPILE completo: o estágio de build é pinado em `$BUILDPLATFORM`,
# `scripts/build-image-layer.sh` instala `gcc-aarch64-linux-gnu`, roda
# `rustup target add aarch64-unknown-linux-gnu` e exporta `RUSTFLAGS` com
# `PKG_CONFIG_ALLOW_CROSS`. O compilador roda nativo no runner amd64 e EMITE
# código arm64 — nada é emulado. Não precisa de runner arm64, nem de QEMU, nem
# de build no Pi.
#
# ⚠ **O que NÃO é de graça é a capacidade do runner, e isso custou duas
# corridas.** Com as duas arquiteturas no mesmo job, a compilação morria aos 17
# min — e o log PARA no meio de um warning, sem erro, sem "Killed", sem código
# de saída. Procurar `error:` não acha nada. Era o pico de memória do link dos
# crates do workspace, que vêm por último.
#
# A resposta é MATRIZ: uma arquitetura por runner. Cada uma ganha 4 núcleos e
# 16 GB só para si, elas rodam em paralelo, e o tempo de parede vira o de UMA
# em vez da soma. Estrangular `CARGO_BUILD_JOBS` no mesmo runner resolvia a
# memória e triplicava o relógio; isto resolve os dois.
#
# ⚠ **Dois serviços e não um.** O `CLAUDE.md` diz que uma feature de API vai em
# `api` e um evento novo no websocket vai em `events`, "quase sempre com `api`
# junto" — e os dois saem da mesma base, que é a parte cara.
#
# Os outros cinco (`autumn`, `january`, `crond`, `pushd`, `voice-ingress`)
# seguem pinados no upstream de propósito: a regra é forkar o serviço DONO da
# superfície que muda, e continuar recebendo correção de segurança de graça nos
# demais.
name: Vortex server images

on:
  push:
    branches:
      - main
    paths:
      - "server/crates/**"
      - "server/Cargo.toml"
      - "server/Cargo.lock"
      - "server/scripts/build-image-layer.sh"
      - "server/Dockerfile"
      - ".github/workflows/vortex-server-image.yml"
  workflow_dispatch:

concurrency:
  group: vortex-api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE: vortex-server-base

jobs:
  # ---------------------------------------------------------------- a base
  #
  # Um job por arquitetura. Cada um empurra a imagem POR DIGEST, sem tag: uma
  # tag só pode apontar para uma coisa, e dois jobs escrevendo a mesma tag em
  # paralelo deixariam a última a ganhar em vez das duas a conviver. O job
  # `publicar` junta os digests num manifesto multi-arch.
  base:
    name: Base (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 é o Pi, que é o alvo.
          - arch: arm64
            plataforma: linux/arm64
          # ⚠ amd64 NÃO é enfeite: é o que a stack local pulla na máquina de
          # quem desenvolve (`make vortex-local-up`). Sem ele, apontar
          # `VORTEX_API_IMAGE` para este fork quebraria o ambiente de
          # desenvolvimento inteiro.
          - arch: amd64
            plataforma: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # ⚠ O `ubuntu-latest` traz ~30 GB de ferramentas que nada aqui usa, e a
      # árvore de crates mais as camadas do Docker não cabem no que sobra. O
      # `df -h` dos dois lados existe para a próxima falha ser diagnosticável
      # em vez de muda.
      - name: Free up disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h / | tail -1

      # Rede de segurança sobre os 16 GB do runner. O link de um binário Rust
      # grande é um pico curto: com swap ele fica lento em vez de morrer, e
      # lento é um resultado — morto não é.
      - name: Add swap
        run: |
          sudo fallocate -l 12G /swap2 && sudo chmod 600 /swap2
          sudo mkswap /swap2 && sudo swapon /swap2
          free -h | head -3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the owner
        id: dono
        run: echo "nome=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./server
          platforms: ${{ matrix.plataforma }}
          provenance: false
          # ⚠ **Só os DOIS binários que este fork publica.**
          #
          # A base do upstream compila oito — delta, bonfire, autumn, january,
          # gifbox, crond, pushd, voice-ingress — porque o upstream publica os
          # oito. Aqui os outros seis seguem pinados no upstream, então
          # compilá-los era trabalho puro para o lixo.
          #
          # E não era só desperdício: era A FALHA. Três corridas morreram no
          # link, sem erro no log, e o `df -h` provou que disco não era —
          # sobravam 110 GB. Era memória, e o `autumn` sozinho arrasta a árvore
          # de codecs de imagem.
          #
          # `jobs=4` junto: com seis binários a menos, o pico cai o bastante
          # para caber, e a margem sobre o default vale mais que os minutos.
          build-args: |
            CARGO_BUILD_JOBS=4
            CARGO_PACKAGES=-p revolt-delta -p revolt-bonfire
          outputs: type=image,name=ghcr.io/${{ steps.dono.outputs.nome }}/${{ env.BASE }},push-by-digest=true,name-canonical=true,push=true
          # Escopo por arquitetura: um cache só faria os dois jobs
          # sobrescreverem o trabalho um do outro a cada corrida.
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,scope=base-${{ matrix.arch }},mode=max

      # O digest vira um arquivo VAZIO com o nome dele. É a forma que a
      # documentação do buildx usa: o merge só precisa da lista de nomes, e
      # conteúdo nenhum precisa atravessar.
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------- o manifesto e as imagens
  #
  # Junta os dois digests numa tag multi-arch e constrói as imagens de serviço.
  # Elas são baratas — cada Dockerfile só copia UM binário da base para um
  # `distroless` —, então as duas plataformas cabem num job só.
  publicar:
    name: Manifest and services
    runs-on: ubuntu-latest
    needs: base
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the owner
        id: dono
        run: echo "nome=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # ⚠ Conferido ANTES de juntar: com um dos jobs falhando e `fail-fast`
      # desligado, o manifesto sairia com uma arquitetura só — e um `docker
      # pull` no Pi então acusaria "no matching manifest", longe daqui e sem
      # relação óbvia com este passo.
      - name: Merge into a multi-arch tag
        working-directory: /tmp/digests
        run: |
          ls -1
          if [ "$(ls -1 | wc -l)" -ne 2 ]; then
            echo "::error::Esperava 2 digests (arm64 e amd64) e achei $(ls -1 | wc -l)." >&2
            exit 1
          fi
          IMG="ghcr.io/${{ steps.dono.outputs.nome }}/${{ env.BASE }}"
          docker buildx imagetools create \
            -t "${IMG}:${{ github.sha }}" \
            $(printf "${IMG}@sha256:%s " *)
          docker buildx imagetools inspect "${IMG}:${{ github.sha }}"

      - name: Publish the API (delta)
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./server
          file: ./server/crates/delta/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.dono.outputs.nome }}/${{ env.BASE }}:${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.dono.outputs.nome }}/vortex-server-api:main
            ghcr.io/${{ steps.dono.outputs.nome }}/vortex-server-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Vortex API
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish events (bonfire)
        id: events
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./server
          file: ./server/crates/bonfire/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.dono.outputs.nome }}/${{ env.BASE }}:${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.dono.outputs.nome }}/vortex-server-events:main
            ghcr.io/${{ steps.dono.outputs.nome }}/vortex-server-events:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Vortex events
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Report the digests to pin
        run: |
          {
            echo "### Imagens publicadas"
            echo
            echo '```'
            echo "VORTEX_API_IMAGE=ghcr.io/${{ steps.dono.outputs.nome }}/vortex-server-api:${{ github.sha }}@${{ steps.api.outputs.digest }}"
            echo "VORTEX_EVENTS_IMAGE=ghcr.io/${{ steps.dono.outputs.nome }}/vortex-server-events:${{ github.sha }}@${{ steps.events.outputs.digest }}"
            echo '```'
            echo
            echo "Atualize \`compose/versions.env\` no pi-infra; o merge dispara o deploy."
            echo
            echo "⚠ Os outros cinco serviços seguem pinados no upstream de propósito."
          } >> "$GITHUB_STEP_SUMMARY"
