# Constrói delta e bonfire para amd64/arm64 e publica uma imagem runtime Vortex.
#
# ⚠ **O `CLAUDE.md` do cliente registrava isto como bloqueado, e a premissa
# estava errada.** Ela dizia: "o truque do `$BUILDPLATFORM` que salva o cliente
# web não transfere para Rust — binário Rust é específico de arquitetura, não
# existe estágio neutro para rodar nativo".
#
# Verdade em geral; falso para este repositório. O `Dockerfile` do upstream já
# faz CROSS-COMPILE completo: o estágio de build é pinado em `$BUILDPLATFORM`,
# `scripts/build-image-layer.sh` instala `gcc-aarch64-linux-gnu`, roda
# `rustup target add aarch64-unknown-linux-gnu` e exporta `RUSTFLAGS` com
# `PKG_CONFIG_ALLOW_CROSS`. O compilador roda nativo no runner amd64 e EMITE
# código arm64 — nada é emulado. Não precisa de runner arm64, nem de QEMU, nem
# de build no Pi.
#
# ⚠ **O que NÃO é de graça é a capacidade do runner, e isso custou duas
# corridas.** Com as duas arquiteturas no mesmo job, a compilação morria aos 17
# min — e o log PARA no meio de um warning, sem erro, sem "Killed", sem código
# de saída. Procurar `error:` não acha nada. Era o pico de memória do link dos
# crates do workspace, que vêm por último.
#
# A resposta é MATRIZ: uma arquitetura por runner. Cada uma ganha 4 núcleos e
# 16 GB só para si, elas rodam em paralelo, e o tempo de parede vira o de UMA
# em vez da soma. Estrangular `CARGO_BUILD_JOBS` no mesmo runner resolvia a
# memória e triplicava o relógio; isto resolve os dois.
#
# Os outros serviços seguem pinados no upstream. O runtime contém somente os
# dois binários compilados por CARGO_PACKAGES; o compose escolhe qual executar.
# Publica a imagem runtime quando uma GitHub Release `v*` cobre `server/`
# desde a tag anterior. `workflow_dispatch` força o build.
name: Vortex server image

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: vortex-server-image-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE: vortex-server-base

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.d.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --tags --force
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE"...HEAD)
            if FILES="$files" scripts/ci/changed.sh server; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if scripts/ci/changed.sh server; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/release-notes.sh

  # PR que toca server/: compila e testa delta+bonfire. Sem docker —
  # a imagem multi-arch leva ~2h e fica no release.
  check:
    name: Check
    needs: detect
    if: needs.detect.outputs.changed == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup update stable && rustup default stable
      - run: cargo check -p revolt-delta -p revolt-bonfire --locked
      - run: cargo test -p revolt-delta -p revolt-bonfire --locked

  # Check required. Falha se o check do PR falhou; passa se não tocou server/.
  result:
    name: Vortex server
    needs: [detect, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          changed="${{ needs.detect.outputs.changed }}"
          check="${{ needs.check.result }}"
          event="${{ github.event_name }}"
          echo "changed=$changed check=$check event=$event detect=${{ needs.detect.result }}"
          if [ "${{ needs.detect.result }}" != "success" ]; then exit 1; fi
          if [ "$event" != "pull_request" ]; then exit 0; fi
          if [ "$changed" != "true" ]; then exit 0; fi
          if [ "$check" = "success" ]; then exit 0; fi
          exit 1

  # ---------------------------------------------------------------- a base
  #
  # Um job por arquitetura. Cada um empurra a imagem POR DIGEST, sem tag: uma
  # tag só pode apontar para uma coisa, e dois jobs escrevendo a mesma tag em
  # paralelo deixariam a última a ganhar em vez das duas a conviver. O job
  # `publicar` junta os digests num manifesto multi-arch.
  base:
    name: Base (${{ matrix.arch }})
    needs: detect
    if: needs.detect.outputs.changed == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 é o Pi, que é o alvo.
          - arch: arm64
            plataforma: linux/arm64
          # ⚠ amd64 NÃO é enfeite: é o que a stack local pulla na máquina de
          # quem desenvolve (`make vortex-local-up`). Sem ele, apontar
          # `VORTEX_SERVER_IMAGE` para este fork quebraria o ambiente de
          # desenvolvimento inteiro.
          - arch: amd64
            plataforma: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # ⚠ O `ubuntu-latest` traz ~30 GB de ferramentas que nada aqui usa, e a
      # árvore de crates mais as camadas do Docker não cabem no que sobra. O
      # `df -h` dos dois lados existe para a próxima falha ser diagnosticável
      # em vez de muda.
      - name: Free up disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h / | tail -1

      # Rede de segurança sobre os 16 GB do runner. O link de um binário Rust
      # grande é um pico curto: com swap ele fica lento em vez de morrer, e
      # lento é um resultado — morto não é.
      - name: Add swap
        run: |
          sudo fallocate -l 12G /swap2 && sudo chmod 600 /swap2
          sudo mkswap /swap2 && sudo swapon /swap2
          free -h | head -3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the owner
        id: dono
        run: echo "nome=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./server
          platforms: ${{ matrix.plataforma }}
          provenance: false
          # ⚠ **Só os DOIS binários que este fork publica.**
          #
          # A base do upstream compila oito — delta, bonfire, autumn, january,
          # gifbox, crond, pushd, voice-ingress — porque o upstream publica os
          # oito. Aqui os outros seis seguem pinados no upstream, então
          # compilá-los era trabalho puro para o lixo.
          #
          # E não era só desperdício: era A FALHA. Três corridas morreram no
          # link, sem erro no log, e o `df -h` provou que disco não era —
          # sobravam 110 GB. Era memória, e o `autumn` sozinho arrasta a árvore
          # de codecs de imagem.
          #
          # `jobs=4` junto: com seis binários a menos, o pico cai o bastante
          # para caber, e a margem sobre o default vale mais que os minutos.
          build-args: |
            CARGO_BUILD_JOBS=4
            CARGO_PACKAGES=-p revolt-delta -p revolt-bonfire
          outputs: type=image,name=ghcr.io/${{ steps.dono.outputs.nome }}/${{ env.BASE }},push-by-digest=true,name-canonical=true,push=true
          # Escopo por arquitetura: um cache só faria os dois jobs
          # sobrescreverem o trabalho um do outro a cada corrida.
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,scope=base-${{ matrix.arch }},mode=max

      # O digest vira um arquivo VAZIO com o nome dele. É a forma que a
      # documentação do buildx usa: o merge só precisa da lista de nomes, e
      # conteúdo nenhum precisa atravessar.
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------- manifesto e imagem runtime
  #
  # Junta os dois digests numa base multi-arch e copia ambos os binários para a
  # única imagem runtime. O compose define o comando de cada serviço.
  publicar:
    name: Manifest and runtime
    runs-on: ubuntu-latest
    needs: [detect, base]
    if: needs.detect.outputs.changed == 'true' && github.event_name != 'pull_request'
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the owner
        id: dono
        run: echo "nome=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "list<<EOF"
            echo "ghcr.io/${owner}/vortex-server:latest"
            echo "ghcr.io/${owner}/vortex-server:${GITHUB_SHA}"
            if [ "${{ github.event_name }}" = "release" ]; then
              echo "ghcr.io/${owner}/vortex-server:${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ⚠ Conferido ANTES de juntar: com um dos jobs falhando e `fail-fast`
      # desligado, o manifesto sairia com uma arquitetura só — e um `docker
      # pull` no Pi então acusaria "no matching manifest", longe daqui e sem
      # relação óbvia com este passo.
      - name: Merge into a multi-arch tag
        working-directory: /tmp/digests
        run: |
          ls -1
          if [ "$(ls -1 | wc -l)" -ne 2 ]; then
            echo "::error::Esperava 2 digests (arm64 e amd64) e achei $(ls -1 | wc -l)." >&2
            exit 1
          fi
          IMG="ghcr.io/${{ steps.dono.outputs.nome }}/${{ env.BASE }}"
          docker buildx imagetools create \
            -t "${IMG}:${{ github.sha }}" \
            $(printf "${IMG}@sha256:%s " *)
          docker buildx imagetools inspect "${IMG}:${{ github.sha }}"

      - name: Publish the server runtime
        id: server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./server
          file: ./server/Dockerfile.runtime
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.dono.outputs.nome }}/${{ env.BASE }}:${{ github.sha }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=Vortex server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Report the digest to pin
        run: |
          {
            echo "### Imagem publicada"
            echo
            echo '```'
            echo "VORTEX_SERVER_IMAGE=ghcr.io/${{ steps.dono.outputs.nome }}/vortex-server:${{ github.sha }}@${{ steps.server.outputs.digest }}"
            echo '```'
            echo
            echo "O build atualiza o PR de imagens do pi-infra; o merge dispara o deploy."
            echo
            echo "⚠ Os outros cinco serviços seguem pinados no upstream de propósito."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: enzolaOps
          repositories: pi-infra

      - name: Update the deployment PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SERVER_IMAGE: ghcr.io/${{ steps.dono.outputs.nome }}/vortex-server:${{ github.sha }}@${{ steps.server.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          jq -n \
            --arg image "$SERVER_IMAGE" \
            --arg revision "$REVISION" \
            '{event_type:"vortex-server-published",client_payload:{revision:$revision,updates:{VORTEX_SERVER_IMAGE:$image}}}' |
            curl --fail-with-body \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data @- \
              https://api.github.com/repos/enzolaOps/pi-infra/dispatches
