# Constrói o cliente React e publica no GHCR.
#
# Irmão de `vortex-image.yml`, que faz o mesmo para o cliente Solid em `web/`.
# Os dois convivem de propósito enquanto o port não substitui o outro: a ilha
# React é o produto novo, e a Solid é o que está no ar.
#
# O repositório é privado, então os runners arm64 nativos e gratuitos não estão
# disponíveis. A imagem é construída em runner amd64: o Dockerfile pina o
# estágio de build em $BUILDPLATFORM, então `pnpm install` e `vite build` rodam
# nativos e só o estágio de runtime — uma dependência de JavaScript puro — é
# emulado.
#
# O digest a pinar sai no resumo do job.
name: Vortex React image

on:
  push:
    branches:
      - main
    paths:
      - "web-react/**"
      - "!web-react/**/*.md"
      - "brand/**"
      - ".dockerignore"
      - ".github/workflows/vortex-react-image.yml"
  workflow_dispatch:

concurrency:
  group: vortex-react-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Diretório de submodule vazio não falha onde acontece: o `pnpm --filter`
      # sai com 0 quando nenhum projeto casa, e o erro só aparece muito depois
      # como um import que não resolve. A ilha React tem UM submodule; a Solid
      # tem três.
      - name: Verify the SDK submodule was checked out
        run: |
          if [ -z "$(ls -A web-react/packages/stoat.js 2>/dev/null)" ]; then
            echo "web-react/packages/stoat.js está vazio — falta o gitlink ou a entrada em .gitmodules." >&2
            exit 1
          fi

      # ⚠ O repositório se chama `vortex` (foi renomeado de `vortex-web`), então
      # isto publica `ghcr.io/enzolaops/vortex-react` — NÃO `vortex-web-react`.
      # O pacote `vortex-web` no GHCR é o de antes da renomeação e está parado;
      # pinar ele no pi-infra entrega uma imagem velha sem nenhum aviso.
      - name: Lowercase the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-react" >> "$GITHUB_OUTPUT"

      # Só o estágio de runtime arm64 precisa de emulação.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          # ⚠ **Contexto na RAIZ, e não em `./web-react`.** O `vite.config.ts`
          # tem um plugin que lê `brand/mark.svg` da raiz e o emite no bundle;
          # com o contexto na ilha o build morre em `ENOENT: /brand/mark.svg`.
          # Descoberto construindo a imagem localmente — o `pnpm build` do host
          # passa, porque lá o arquivo está a três níveis acima.
          #
          # O `.dockerignore` da raiz derruba tudo que não é `brand/` ou
          # `web-react/`, então o contexto não carrega `web/` nem `desktop/`.
          context: .
          file: ./web-react/Dockerfile
          # amd64 custa quase nada aqui (o estágio de build é compartilhado) e
          # deixa o cliente rodar localmente para depuração.
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Vortex React web client
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the digest to pin
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "VORTEX_WEB_IMAGE=${{ steps.image.outputs.name }}:${{ github.sha }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "O build atualiza o PR de imagens do pi-infra."
            echo
            echo "A imagem serve na porta 5000, como a do cliente Solid, e resolve a API"
            echo "contra a própria origem — as variáveis \`VITE_*\` do compose não são"
            echo "necessárias para ela."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update the deployment PR
        env:
          PI_INFRA_TOKEN: ${{ secrets.PI_INFRA_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}@${{ steps.push.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          jq -n --arg image "$IMAGE" --arg revision "$REVISION" '{event_type:"vortex-web-published",client_payload:{revision:$revision,updates:{VORTEX_WEB_IMAGE:$image}}}' |
            curl --fail-with-body \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $PI_INFRA_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data @- \
              https://api.github.com/repos/enzolaOps/pi-infra/dispatches
