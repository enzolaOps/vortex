name: Intelligent release

on:
  pull_request:
    paths:
      - ".github/workflows/intelligent-release.yml"
      - ".jev/presets/release-impact.json"
      - "scripts/ci/intelligent-release.sh"
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never run two release decisions concurrently. A later main push stays queued
# while an earlier decision finishes or safely aborts.
concurrency:
  group: vortex-intelligent-release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate release automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n scripts/ci/intelligent-release.sh
      - name: Validate Jev preset JSON
        run: jq empty .jev/presets/release-impact.json
      - name: Check whitespace errors
        run: git diff --check origin/main...HEAD

  release:
    if: github.event_name != 'pull_request'
    name: Release when the merge queue is drained
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install Jev CLI
        env:
          JEV_VERSION: v2026.919.0
          JEV_INSTALL_DIR: ${{ runner.temp }}/jev-bin
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/model-clis/jev/main/scripts/install.sh | sh
          echo "$JEV_INSTALL_DIR" >> "$GITHUB_PATH"
          "$JEV_INSTALL_DIR/jev" --version

      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: enzolaOps
          repositories: vortex

      - name: Wait for the queue to settle, classify changes, and publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SHA_AT_START: ${{ github.sha }}
        run: scripts/ci/intelligent-release.sh
