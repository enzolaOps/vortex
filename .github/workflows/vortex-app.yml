# Interface nova (`client/packages/app`): check completo e fumaça E2E, sem back-end.
#
# Dois jobs, independentes:
#   check  `pnpm --filter app check`: typecheck, lint, guardas, testes (node + modo
#          navegador, com Chromium do Playwright) e build.
#   e2e    `pnpm --filter app e2e:fumaca`: Playwright contra o build de produção do app.
#          O `globalSetup` tenta a API da pilha local do pi-infra (privado, fora deste job),
#          não a acha e PULA os specs @backend: o job roda só o que não precisa de servidor.
#          Os E2E de jornada, com a pilha, entram quando a deploy key só-leitura do pi-infra
#          existir (TRD §9).
#
# O gate do firehose NÃO roda aqui: em runner do GitHub a vazão fica abaixo de 90% e a
# corrida sai inválida (TRD §12 nº 4). O gate é local, com o relatório colado no PR.
#
# Só ações da GitHub, pinadas por SHA como nos outros workflows: a política do
# repositório recusa as de terceiros e o run nem começa (`startup_failure`).
name: Vortex app

on:
  pull_request:
    paths:
      - "client/packages/app/**"
      - "client/packages/nucleo/**"
      - "client/pnpm-lock.yaml"
      - ".github/workflows/vortex-app.yml"

concurrency:
  group: vortex-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 11.3.0

jobs:
  check:
    name: App check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - name: Store do pnpm
        id: pnpm
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache do pnpm
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: ${{ runner.os }}-app-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-app-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter stoat.js build
      # Os testes de componente do app rodam em Chromium (modo navegador do Vitest).
      - run: pnpm --filter app exec playwright install --with-deps chromium
      - run: pnpm --filter app check

  e2e:
    name: E2E fumaça
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - name: Store do pnpm
        id: pnpm
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache do pnpm
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: ${{ runner.os }}-app-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-app-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter stoat.js build
      - run: pnpm --filter app exec playwright install --with-deps chromium
      # O `webServer` do playwright.config.ts constrói o app e o serve em :4173.
      - run: pnpm --filter app e2e:fumaca
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: client/packages/app/playwright-report
          if-no-files-found: ignore
          retention-days: 7
