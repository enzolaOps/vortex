name: Preparar o client
description: Node, pnpm com cache, dependências e o build do stoat.js. Exige checkout com submodules.

inputs:
  playwright:
    description: Instala o Chromium do Playwright (testes de navegador e E2E).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Diretório de submodule vazio não falha onde acontece: o `pnpm --filter`
    # sai com 0 quando nenhum projeto casa, e o erro só aparece muito depois
    # como um import que não resolve.
    - name: Conferir o submodule do SDK
      shell: bash
      run: |
        if [ -z "$(ls -A client/packages/stoat.js 2>/dev/null)" ]; then
          echo "client/packages/stoat.js está vazio — falta o gitlink." >&2
          exit 1
        fi

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24

    - name: Ativar o pnpm
      shell: bash
      run: corepack enable && corepack prepare pnpm@11.3.0 --activate

    - name: Store do pnpm
      id: pnpm
      shell: bash
      working-directory: client
      run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Cache do pnpm
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: ${{ runner.os }}-client-${{ hashFiles('client/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-client-

    - name: Instalar dependências
      shell: bash
      working-directory: client
      run: pnpm install --frozen-lockfile

    - name: Build do stoat.js
      shell: bash
      working-directory: client
      run: pnpm --filter stoat.js build

    - name: Cache do Playwright
      if: inputs.playwright == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('client/pnpm-lock.yaml') }}

    - name: Instalar o Chromium
      if: inputs.playwright == 'true'
      shell: bash
      working-directory: client
      run: pnpm --filter app exec playwright install --with-deps chromium
