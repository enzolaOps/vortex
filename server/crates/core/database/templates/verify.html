<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vortex</title>
  </head>
  <body style="margin:0;padding:0;background:#08090b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#08090b;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;">
            <tr>
              <td style="padding:0 0 24px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;letter-spacing:0.18em;color:#35c2cc;font-weight:700;">VORTEX</td>
            </tr>
            <tr>
              <td style="background:#141820;border:1px solid #2a3038;border-radius:8px;padding:32px;font-family:Arial,Helvetica,sans-serif;color:#e8eaed;">
                <h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;color:#f4f6f8;">Confirme seu e-mail</h1>
                <p style="margin:0 0 16px 0;font-size:15px;line-height:1.5;color:#c5cad3;">Para terminar o cadastro no Vortex, confirme este endereço.</p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td bgcolor="#35c2cc" style="border-radius:6px;">
                      <a href="{{url}}" style="display:inline-block;padding:12px 20px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#04181b;text-decoration:none;">Confirmar e-mail</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0 0;font-size:13px;line-height:1.5;color:#8992a0;">Se o botão não funcionar, copie este endereço:<br />{{url}}</p>
                <p style="margin:16px 0 0 0;font-size:13px;color:#8992a0;">Este e-mail foi enviado para {{email}}. Se você não criou uma conta, ignore.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
