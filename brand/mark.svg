<!--
  Vortex app mark — PLACEHOLDER.

  This is the single source of truth for every raster icon in the client.
  Replace this file with the real logo and run `node brand/generate.mjs`;
  every PNG and the .ico are regenerated from it.

  Keep the 512x512 viewBox and keep the artwork inside it. The rounded
  rectangle is part of the mark and is used for the favicon and the standard
  PWA icons; the maskable icon is generated separately with padding, because
  Android crops it to its own shape.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2436"/>
      <stop offset="1" stop-color="#0C1120"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AE7FF"/>
      <stop offset="1" stop-color="#6C7CFF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <g fill="url(#blade)">
    <path d="M256 256 C 268 186, 328 140, 402 140 C 402 214, 344 262, 256 256 Z"/>
    <path d="M256 256 C 268 186, 328 140, 402 140 C 402 214, 344 262, 256 256 Z" transform="rotate(120 256 256)"/>
    <path d="M256 256 C 268 186, 328 140, 402 140 C 402 214, 344 262, 256 256 Z" transform="rotate(240 256 256)"/>
  </g>

  <circle cx="256" cy="256" r="26" fill="#0C1120"/>
</svg>
