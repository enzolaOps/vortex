<!--
  Vortex app mark.

  Tres pas espiralando para dentro. A curva e uma espiral logaritmica
  (r = R0 * e^(k*t), varredura de 135 graus, afinando de 35 graus na borda
  ate a ponta) — a mesma curva de redemoinho e concha, e a razao de a marca
  ler como vortice e nao como ventoinha.

  Chapado de proposito: gradiente roxo/azul e antipadrao declarado do
  projeto, e era exatamente o que o placeholder anterior fazia. A leitura de
  profundidade vem da opacidade escalonada entre as pas, que sobrevive em
  monocromatico e a 16px.

  Fonte unica de todo icone raster do cliente. Ao trocar, rode
  `node brand/generate.mjs` e espelhe a arte em monochrome.svg e
  wordmark.svg.

  Mantenha o viewBox 512x512. O retangulo arredondado faz parte da marca e
  e usado no favicon e nos icones PWA padrao; o maskable e gerado a parte,
  com folga, porque o Android recorta na propria forma.
-->
