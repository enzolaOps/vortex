<!--
  Horizontal lockup: mark plus name. Rendered as an <img>, so the text uses a
  generic sans stack and will look slightly different per platform. Replace with
  real outlined type when the logo is designed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" width="520" height="128">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AE7FF"/>
      <stop offset="1" stop-color="#6C7CFF"/>
    </linearGradient>
  </defs>

  <g transform="translate(4 4) scale(0.234)" fill="url(#blade)">
    <path d="M256 256 C 268 186, 328 140, 402 140 C 402 214, 344 262, 256 256 Z"/>
    <path d="M256 256 C 268 186, 328 140, 402 140 C 402 214, 344 262, 256 256 Z" transform="rotate(120 256 256)"/>
    <path d="M256 256 C 268 186, 328 140, 402 140 C 402 214, 344 262, 256 256 Z" transform="rotate(240 256 256)"/>
  </g>

  <text x="146" y="86"
        font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="600" letter-spacing="-1.5"
        fill="currentColor">Vortex</text>
</svg>
